name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onlystudent
          POSTGRES_PASSWORD: onlystudent
          POSTGRES_DB: onlystudent-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/onlystudent-test
          TEST_DB_USERNAME: onlystudent
          TEST_DB_PASSWORD: onlystudent
        run: ./mvnw clean test
