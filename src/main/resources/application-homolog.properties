# Homologação — credenciais vêm do ambiente (DB_* preferencial; PG* como fallback)
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require}
spring.datasource.username=${DB_USERNAME:${PGUSER}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD}}

# Porta de homologação
server.port=${PORT:8080}

# CORS de homolog
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://onlystudy.netlify.app}

# JWT
api.security.token.security=${JWT_SECRET}

# Hikari (evita conexão morta com poolers gerenciados)
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-test-query=SELECT 1
