spring.application.name=OnlyStudent
spring.profiles.default=dev

# JWT (A Vercel vai criar como jwt_secret)
api.security.token.security=${jwt_secret}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username:}
spring.mail.password=${mail_password:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Banco de Dados Neon (Vercel cria em minúsculo)
spring.datasource.url=${db_url:jdbc:postgresql://localhost:5432/onlystudent}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Porta e CORS (Vercel cria em minúsculo)
server.port=${PORT:8082}
app.cors.allowed-origins=${cors_allowed_origins:http://localhost:5173,http://localhost:3000}

# Rate Limit
app.auth.rate-limit.requests=10
app.auth.rate-limit.window-seconds=60
app.support.rate-limit.requests=5
app.support.rate-limit.window-seconds=3600