spring.application.name=OnlyStudent
spring.profiles.default=dev

api.security.token.security=${JWT_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onlystudent}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8082}
spring.jpa.open-in-view=false
app.auth.rate-limit.requests=10
app.auth.rate-limit.window-seconds=60
app.support.rate-limit.requests=5
app.support.rate-limit.window-seconds=3600
