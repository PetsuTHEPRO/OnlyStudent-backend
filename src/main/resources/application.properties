spring.application.name=OnlyStudent

# Banco — sempre via variáveis de ambiente (injetadas em dev/homolog/prod)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Porta (plataformas de deploy injetam PORT; local usa 8082)
server.port=${PORT:8082}

# Segurança / CORS
api.security.token.security=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
