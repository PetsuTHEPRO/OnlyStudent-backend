# Local dev: usa onlystudent-test (defaults abaixo)
# CI: sobrescreve via TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/onlystudent-test}
spring.datasource.username=${TEST_DB_USERNAME:onlystudent}
spring.datasource.password=${TEST_DB_PASSWORD:onlystudent}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true

api.security.token.security=onlystudent-test-signing-secret-not-for-production-123456
app.cors.allowed-origins=http://localhost:5173
app.auth.rate-limit.requests=100
app.auth.rate-limit.window-seconds=60